# Packages the addons as PadKeys.zip: the PadKeys/ base folder and the
# PadKeys_*/ folders, side by side for Interface/AddOns, plus the latest
# stable SpellActivationOverlay (MIT, ennvina/spellactivationoverlay) for
# PadKeys_Bar's proc glows. A daily run picks up new versions of it.
# Pull requests: syntax-check the Lua and build the zip as a check.
# Pushes to main: also publish the zip on the "padkeys-latest" release, so
# installing is: download PadKeys.zip, unzip into Interface/AddOns.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  pull_request:
  workflow_dispatch:

name: release.yaml

permissions: read-all

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check Lua syntax
        run: |
          sudo apt-get install -y -q lua5.1
          for f in PadKeys*/*.lua; do luac5.1 -p "$f"; done

      - name: Build PadKeys.zip
        run: git archive --format=zip -o PadKeys.zip HEAD $(ls -d PadKeys*/)

      # Newest vX.Y.Z tag (no alpha/beta), with the files its own packager
      # puts in the base package. Fails the run rather than publish a zip
      # without it.
      - name: Add the latest SpellActivationOverlay
        run: |
          repo=https://github.com/ennvina/spellactivationoverlay.git
          tag=$(git ls-remote --tags --refs "$repo" | awk -F/ '{print $3}' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          test -n "$tag"
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$tag" "$repo" sao
          mkdir -p bundle/SpellActivationOverlay
          (cd sao && cp -R changelog.md LICENSE SpellActivationOverlay.* classes \
            components libs options sounds textures variables \
            ../bundle/SpellActivationOverlay/)
          (cd bundle && zip -qr ../PadKeys.zip SpellActivationOverlay)
          echo "SAO_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Publish the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="PadKeys from main at ${GITHUB_SHA::7}, with SpellActivationOverlay ${SAO_VERSION} (optional, MIT, by ennvina). Install: download PadKeys.zip and unzip it into <WoW>/<Forever client folder>/Interface/AddOns/, so you get Interface/AddOns/PadKeys/PadKeys.toc and the PadKeys_* and SpellActivationOverlay folders next to it. Enable PadKeys first, then the PadKeys_* addons one at a time. Setup steps: README.md."
          if gh release view padkeys-latest > /dev/null 2>&1; then
            gh release upload padkeys-latest PadKeys.zip --clobber
            gh release edit padkeys-latest --notes "$notes"
          else
            gh release create padkeys-latest PadKeys.zip --title "PadKeys (latest)" --notes "$notes"
          fi
