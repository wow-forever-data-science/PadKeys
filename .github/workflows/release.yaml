# Packages the addon as PadKeys.zip (a PadKeys/ folder for Interface/AddOns).
# Pull requests: syntax-check the Lua and build the zip as a check.
# Pushes to main: also publish the zip on the "padkeys-latest" release, so
# installing is: download PadKeys.zip, unzip into Interface/AddOns.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: release.yaml

permissions: read-all

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check Lua syntax
        run: |
          sudo apt-get install -y -q lua5.1
          for f in *.lua; do luac5.1 -p "$f"; done

      - name: Build PadKeys.zip
        run: git archive --format=zip --prefix=PadKeys/ -o PadKeys.zip HEAD

      - name: Publish the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="PadKeys from main at ${GITHUB_SHA::7}. Install: download PadKeys.zip and unzip it into <WoW>/<Forever client folder>/Interface/AddOns/, so you get Interface/AddOns/PadKeys/PadKeys.toc. Setup steps: README.md."
          if gh release view padkeys-latest > /dev/null 2>&1; then
            gh release upload padkeys-latest PadKeys.zip --clobber
            gh release edit padkeys-latest --notes "$notes"
          else
            gh release create padkeys-latest PadKeys.zip --title "PadKeys (latest)" --notes "$notes"
          fi
